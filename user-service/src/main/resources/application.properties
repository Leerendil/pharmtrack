spring.application.name=user-service
server.port=8081

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:9090/realms/pharmtrack

spring.datasource.url=jdbc:postgresql://localhost:5433/user-postgres-db
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update

eureka.client.service-url.deafultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}