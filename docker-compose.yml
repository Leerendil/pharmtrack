services:
  user-db:
    image: postgres:16-alpine
    container_name: user-postgres-db
    ports:
      - "${USER_DB_PORT}:5432"
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${USER_DB_NAME}
    volumes:
      - user-db-data:/var/lib/postgresql/data
    networks:
      - vsu-network

networks:
  vsu-network:
    driver: bridge

volumes:
  user-db-data:
