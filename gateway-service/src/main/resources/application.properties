server.port=8080

spring.application.name=gateway-service

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}

spring.cloud.gateway.mvc.routes[0].id=auth-service
spring.cloud.gateway.mvc.routes[0].uri=lb://auth-service
spring.cloud.gateway.mvc.routes[0].predicates[0]=Path=/api/v1/auth/**

spring.cloud.gateway.mvc.routes[1].id=catalog-service
spring.cloud.gateway.mvc.routes[1].uri=lb://catalog-service
spring.cloud.gateway.mvc.routes[1].predicates[0]=Path=/api/v1/categories/**,/api/v1/manufacturers/**,/api/v1/medicines/**

spring.cloud.gateway.mvc.routes[2].id=order-service
spring.cloud.gateway.mvc.routes[2].uri=lb://order-service
spring.cloud.gateway.mvc.routes[2].predicates[0]=Path=/api/v1/orders/**,/api/v1/carts/**

spring.cloud.gateway.mvc.routes[3].id=user-service
spring.cloud.gateway.mvc.routes[3].uri=lb://user-service
spring.cloud.gateway.mvc.routes[3].predicates[0]=Path=/api/v1/users/**